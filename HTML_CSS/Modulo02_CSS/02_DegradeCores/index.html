<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cores em Degrade</title>
</head>
<body>

    <h1>Fazendo degrade de cores com CSS</h1>

    <style>
        /* Configurações globais do CSS */
        *{
            height: 100%
        }
        /*  */
        body{
            background-image: linear-gradient(45deg, #5C4EC7, #5E5794,#4F4D61 );
            background-attachment: fixed;
            color: whitesmoke;
        }
    </style>

    
</body>
</html>
