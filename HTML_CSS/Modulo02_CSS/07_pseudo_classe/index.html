<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Class</title>

    <style>
        
        div {
            display: inline-block;
            background-color: lightgray;
            border: 2px solid black;
            text-align: center;
            height: 200px;
            width: 200px;
        }

        div:hover {
            background-color: yellow;
        }

        div > p {
            display: none;
        }

        div:hover > p {
            display: block;
            color: white;
            background-color: brown;
        }

    </style>
</head>
<body>
    
    <div id="d1">01</div>
    <div id="d2">02</div>
    <div id="d3">03</div>

    <br>

    <h1>Exemplo de hover</h1>

    <div>
        Passe o mouse sobre este bloco:
        
        <p>
            Texto escondido!!!!!!!!!
        </p>
    </div>

    <p>
        Fim do exemplo de hover
    </p>
    
</body>
</html>
