<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoxModel</title>

    <style>
        h1 {
            background-color: rgb(206, 204, 204);
            height: 300px;
            width: 500px;

            padding: 20px;
            
            border-width: 2px;
            border-style: solid;
            border-color: darkgray;
            
            
            margin: 30px;

            outline-width: 4px;
            outline-style: dashed;
            outline-color: salmon
        
        }

        a {
            border-width: 2px;
            border-style: solid;
            border-color: violet;
            background-color: blueviolet;
            color: antiquewhite;
        }

    </style>
</head>
<body>
    
    <h1>Exemplo de caixa box-level</h1>
    
    <p>
        Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixa inline-level</a>. Vamos ver como tudo isso funciona.
    </p>

</body>
</html>
