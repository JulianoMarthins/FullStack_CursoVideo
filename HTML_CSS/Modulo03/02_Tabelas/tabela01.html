<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>

    <style> 
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        table {
            
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            /* Alinhamento horizontal */
            text-align: center; 
            
        }     
        

        td{
            border: 1px solid black;
            padding: 8px;
            /* Alinhamento vertical */
            vertical-align: middle;
        }

    </style>
</head>
<body>

    <h1>Minha primeira tabela</h1>


    <!-- 
            Hiearquia de tabelas simples

            Table = tabela
                table row = cabeçalho de tabela
                table data = dados da tabela

            
    -->
    <table>
        <!-- Pirmeira linha tabela-->
        <tr> 
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <!-- Segunda linha da tabela -->
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <!-- Terceira linha da tabela -->
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <!-- Quarta linha da tabela -->
         <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
         </tr>
         
        </tr>
    </table>



    
</body>
</html>
