<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafios</title>

    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 600px;
            height: 400px;
            margin-right: auto;
            margin-left: auto;      
            font-weight: bold;      
        }

        td, th {
            border: 2px solid black;
            padding: 3px;                       
        }

    
        .head{
           background-color: darkcyan;
           color: white;
        }

        .media {
             background-color: darkcyan;
             color: white;
             text-align: center;
        }

        .num{
            text-align: center;
        }

        .principal {            
            font-size: 20px;
        }

        .mediaTexto{
            text-align: left;
            background-color: darkcyan;
            color: white;
        }

        #container {
            overflow-x: auto;
        }

        

        
        
    </style>
</head>
<body>

    <div id="container">
        <table>
        
            <thead class="head">
                <tr>
                    <th rowspan="2" scope="col">Área</th>
                    <th rowspan="2" scope="col">Disciplina</th>
                    <th colspan="2" scope="colgroup">Notas</th>
                    <th rowspan="2" scope="col">Média</th>
                </tr>
                <tr>
                    <th scope="col">Nota 1</th>
                    <th scope="col">Nota 2</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th rowspan="4" class="principal" scope="rowgroup">Exatas</th>
                    <td >Matemática</td>
                    <td class="num">7.30</td>
                    <td class="num">8.10</td>
                    <td class="num">7.70</td>
                </tr>
                <tr>
                    <td>Física</td>
                    <td class="num">8.20</td>
                    <td class="num">7.90</td>
                    <td class="num">8.05</td>
                </tr>
                <tr>
                    <td>Química</td>
                    <td class="num">7.10</td>
                    <td class="num">6.60</td>
                    <td class="num">6.85</td>
                </tr>
                <tr>
                    <td>Biologia</td>
                    <td class="num">9.50</td>
                    <td class="num">7.30</td>
                    <td class="num">8.40</td>
                </tr>
                <tr>
                    <th colspan="4" class="mediaTexto" scope="row">Média de Exatas</th>
                    <td class="media">7.75</td>
                </tr>
        
                <tr>
                    <th rowspan="2" class="principal" scope="colgroup">Humanas</th>
                    <td>História</td>
                    <td class="num">5.60</td>
                    <td class="num">8.30</td>
                    <td class="num">6.95</td>
                </tr>
                <tr>
                    <td>Geografia</td>
                    <td class="num">6.10</td>
                    <td class="num">6.70</td>
                    <td class="num">6.40</td>
                </tr>
                <tr>
                    <th colspan="4" class="mediaTexto" scope="row">Média de Humanas</th>
                    <td class="media">6.67</td>
                </tr>
            </tbody>
        </table>
    </div>
    
</body>
</html>
