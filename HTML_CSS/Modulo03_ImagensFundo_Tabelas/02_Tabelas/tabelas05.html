<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>

    <style>
        Body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th, td {
            border: 2px solid black;
            padding: 8px;
        }       

        .cNome {
            background-color: yellowgreen;
        }

        .cGrupo{
            
            background-color: aqua;
        }    

    </style>
</head>
<body>
    
    <h1>Exercício de Tabelas</h1>

    <table>
        <caption>Cadastro</caption>

        <colgroup>
            <col class="cNome">
            <col class="cGrupo" span="2">
            <col class="cProfissão">
        </colgroup>

        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>

        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>

        <tr>
            <td>Juliano Martins</td>
            <td>M</td>
            <td>44</td>
            <td>Desenvolvedor</td>
        </tr>

        <tr class="destaque">
            <td>Karine Jacobsen</td>
            <td>F</td>
            <td>43</td>
            <td>Fisioterapeuta</td>
        </tr>

        <tr>
            <td>Eduardo Souza</td>
            <td>M</td>
            <td>53</td>
            <td>Segurança</td>
        </tr>

        <tr>
            <td>Álvaro Duran</td>
            <td>M</td>
            <td>38</td>
            <td>Técnico de Som</td>
        </tr>

        
    </table>


</body>
</html>
