<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iFrame</title>
    <style>
        body{
            font-family: Georgia, 'Times New Roman', Times, serif
        }

        h1 {
            text-align: center;
            font-size: 3em;
        }

        p {
          
            font-size: 1.8em;
        }

        iframe{
            width: 800px;
            height: 600px;
            border: 3px solid black;
        }

    </style>
    
</head>
<body>

    <h1>Meu primeiro iFrame</h1>

    <p>
        Esta é uma demonstração de um iframe <iframe src="https://www.cursoemvideo.com" frameborder="1" scolling="yes">Nesta parte colocamos a menagem que aparecerá caso o navegador do usuário não seja compativel com os iframes, o ideal é colocar um link do site que tu tentou apresentar ao usuário no iframe</iframe> --, ele pode ser utilizado para a adição de um site dentro de nosso site. 
    </p>

    <p>
        Nem todos os sites aceitam ser carregados por um iframe, como no caso do site do google 
        <iframe src="https://github.com/JulianoMarthins" frameborder="0" >
            <a href="https://gustavoguanabara.github.io">GitHub</a>
        </iframe>, por uma questão de segurança interna do site.
    </p>
    
</body>
</html>
