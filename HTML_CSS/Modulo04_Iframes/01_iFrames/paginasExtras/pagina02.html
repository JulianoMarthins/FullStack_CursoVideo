<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>

    <style>
        body {
            background-color: brown;
            text-align: center;
        }
    </style>
</head>
<body>

    <a href="#" onclick="clicou()">Clique em mim para ser feliz</a>

    <div id="saida"></div>


    <script>
        function clicou(){
            evento = window.document.getElementById("saida")
            evento.innerHTML += '<p>Parabéns!</p>'
        }
    </script>
    
</body>
</html>
