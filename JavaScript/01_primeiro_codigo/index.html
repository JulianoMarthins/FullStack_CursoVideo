<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./css/style.css">
    <title>Hello World!</title>

</head>
<body>

    <h1>Olá! Mundo</h1>
    <p>Já me livrei da maldição</p>

    <script>
        
        // Cria uma caixa de alerta para o usuário com a mensagem passada como argumento
        window.alert("Seja bem vindo ao meu site!");

        // Cria uma caixa solicitando confirmação ou cancelamento, mostrando em tela a mensagem passada como argumento
        window.confirm("Está gostando de JavaScript?");

        // Cria uma caixa solicitando a entrada de um dado que será inserida pelo usuário, será exibida a mensagem passada como argumento
        window.prompt("Digite seu nome: ");

    </script>
    
</body>
</html>
